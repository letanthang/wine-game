// zBot settings for the dedicated server. Mirrors the client-side
// games/counter-strike/bots.cfg so offline and server play feel the same.
// Exec'd from server.cfg on every map start.
//
// bot_enable lives in game_init.cfg, NOT here — by the time server.cfg runs
// the game DLL has already decided whether bots are allowed.

bot_quota 8              // total bots; 0 = none. Bots occupy player slots.
bot_quota_mode "fill"    // fill = bots top the server up to bot_quota as humans join
bot_difficulty 1         // 0 easy, 1 normal, 2 hard, 3 expert
bot_join_team "any"
bot_join_after_player 1  // wait for a human before bots join (saves CPU when empty)
bot_chatter "normal"
bot_auto_vacate 1        // free a slot for a joining human
bot_defer_to_human 0
bot_allow_rogues 1
bot_prefix "[BOT]"
