// Executed by ReGameDLL before the game DLL finishes initialising — the only
// place where bot_enable takes effect on a DEDICATED server. On a listen
// server bots are always allowed and this file is irrelevant.
//
// Verified against the game DLL itself: UTIL_AreBotsAllowed() returns
// "allowed" unconditionally for listen servers, but on a dedicated server it
// reads bot_enable, which must already be non-zero at that point.

bot_enable "1"

// CS:CZ improved hostage AI (needs the host_improv data files) — off.
hostage_ai_enable "0"

mp_hullbounds_sets "1"
