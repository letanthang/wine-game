// CS 1.6 dedicated server (ReHLDS) — executed on every map start.
// Installed by games/counter-strike/rehlds/install.sh; edit the copy in the
// repo, not the one in cstrike/, or the next install will overwrite it.

hostname "CS 1.6 ReHLDS"
rcon_password "__RCON_PASSWORD__"   // generated by install.sh, do not commit
sv_password ""                      // set to require a password to join

// Public server. Set to 1 for a LAN-only server (also skips Steam auth).
sv_lan 0

// Rates
sv_minrate 5000
sv_maxrate 25000
sv_minupdaterate 30
sv_maxupdaterate 100
sv_maxspeed 320
sv_timeout 60

// Anti-cheat / server behaviour
sv_cheats 0
sv_consistency 1
sv_allowupload 1
sv_allowdownload 1
sv_voiceenable 1
mp_consistency 1

// Round rules
mp_autoteambalance 1
mp_limitteams 2
mp_friendlyfire 0
mp_footsteps 1
mp_flashlight 1
mp_freezetime 3
mp_roundtime 3
mp_buytime 0.5
mp_timelimit 25
mp_maxrounds 0
mp_startmoney 800
mp_c4timer 35
mp_autokick 0

// Logging (logs land in cstrike/logs/)
log on
mp_logmessages 1
mp_logdetail 3

// zBot settings — see bots.cfg. Bots also need bot_enable 1 in game_init.cfg,
// which is read before the game DLL starts; setting it here is too late.
exec bots.cfg
