// Bot settings for the native Xash3D build of CS 1.6.
// Source of truth: this repo. run.sh copies it into ~/Games/cs16/cstrike/
// and makes listenserver.cfg exec it on every map start.
//
// These are the CZ ("official") bots built into ReGameDLL's cs_arm64.dylib —
// no Metamod, no YaPB. They need maps/<map>.nav, which this install has for
// all 27 maps.
//
// Override the bot count per launch: BOTS=12 games/counter-strike/run.sh
// (run.sh rewrites the bot_quota line in the installed copy).

bot_enable 1             // dedicated servers only; listen servers always allow bots
bot_quota 8              // total bots on the server; 0 disables them
bot_quota_mode "normal"  // normal = fixed count | fill = bots top up to quota | match = bots per human
bot_difficulty 1         // 0 easy, 1 normal, 2 hard, 3 expert
bot_join_team "any"      // any | T | CT
bot_join_after_player 0  // 1 = wait for a human to join before bots do
bot_chatter "normal"     // off | radio | minimal | normal
bot_auto_vacate 1        // kick a bot when a human needs the slot
bot_defer_to_human 0     // 1 = bots do not plant/defuse, they leave it to humans
bot_allow_rogues 1       // let some bots go lone-wolf instead of following the team
bot_prefix "[BOT]"       // name prefix in the scoreboard

// Round setup that makes offline play with bots pleasant
mp_autoteambalance 1
mp_limitteams 1
mp_roundtime 3
mp_freezetime 3
